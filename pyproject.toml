[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contentbot"
version = "0.1.0"
description = "Universal multi-project content pipeline: material -> texts -> voice -> preview -> publish"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "aiogram>=3.4"]
bot = ["aiogram>=3.4"]

[project.scripts]
contentbot = "contentbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
